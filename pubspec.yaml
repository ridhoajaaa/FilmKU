name: filmku
description: "FilmKU — an ad-free movie streaming app. Dark, fast, and clean."
publish_to: "none"
version: 1.3.8+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.2.0
  # Networking
  dio: ^5.4.3
  # Image loading & caching
  cached_network_image: ^3.3.1
  # Native video playback (HLS / m3u8 / mp4)
  # libmpv-backed playback (media_kit): transparently falls back to software
  # decoding, which plays HLS MPEG-TS streams that ExoPlayer's MediaCodec
  # renderer crashes on (observed: `MediaCodecVideoRenderer error` on Xiaomi).
  # Used as the native destination for WebView-handoff streams.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.1.5
  # iOS needs its own libmpv binaries — WITHOUT this the iOS build compiles
  # but the native (mpv) player has no renderer. Android is unaffected.
  media_kit_libs_ios_video: ^1.1.4
  # Local storage (Watchlist & Settings)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  # Headless WebView used to extract direct stream URLs (no visible ads)
  flutter_inappwebview: ^6.1.5
  # Material icons
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^0.28.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # Vendored copy of flutter_inappwebview_android with a one-line proguard fix
  # for AGP 9 (getDefaultProguardFile('proguard-android.txt') was removed). The
  # pub-cache version is unpatched, so this local override keeps the fix
  # permanent across machines/CI. See third_party/README.md and the Android
  # Build Notes section of the main README.
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

flutter:
  uses-material-design: true
